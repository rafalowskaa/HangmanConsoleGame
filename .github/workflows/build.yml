name: Build Hangman Game

on:
  push:
    branches:
      - main  

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v1

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 9.0'  

    - name: Restore dependencies
      run: dotnet restore

    - name: Build project
      run: dotnet build --configuration Release

    - name: Publish executable
      run: |
        mkdir release
        copy .\WisielecConsole\bin\Release\*.* .\release\
      shell: cmd

    - name: Upload release assets
      uses: actions/upload-artifact@v3
      with:
        name: HangmanGame
        path: release
