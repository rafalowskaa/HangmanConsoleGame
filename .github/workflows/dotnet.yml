name: .NET

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Restore dependencies
        run: dotnet restore WisielecConsole.csproj
      - name: Build
        run: dotnet build WisielecConsole.csproj --no-restore --configuration Release
      - name: Publish
        run: dotnet publish WisielecConsole.csproj --no-build --configuration Release --output artifacts/HangmanGame
      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: HangmanGame
          path: artifacts/HangmanGame/
          if-no-files-found: error
          retention-days: 14
